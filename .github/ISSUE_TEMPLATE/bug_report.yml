name: Bug report
description: Something behaves differently from what the architecture documents specify
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Affected package(s)
      placeholder: presentation-state
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior (cite the architecture document + section)
      description: The handbook is the source of truth — what does it say should happen?
      placeholder: "State-Management.md §10 says nested dispatch is queued FIFO, but…"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior + minimal reproduction
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Package version(s), Node version, environment
