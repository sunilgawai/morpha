name: Release

# Infrastructure prepared; actual npm publishing stays OFF until a publishing
# ADR flips packages to public (all packages are currently private: true, and
# the changesets config tags nothing for private packages).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create or update the Version Packages PR
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          # publish is intentionally omitted — see the publishing note above
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
