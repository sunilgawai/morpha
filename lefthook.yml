# Git hooks — fast, minimal. The full gauntlet is `pnpm check` / CI.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: cspell
      glob: "*.{ts,tsx,md}"
      run: pnpm exec cspell --no-progress --no-must-find-files {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
